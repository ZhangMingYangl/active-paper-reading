name: Release

# 改了 VERSION 并推到 main，就自动发一个同名 Release（例如 v0.6），说明取自 CHANGELOG.md。
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release if it does not exist yet
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(tr -d '[:space:]' < VERSION)"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag 已经发过了"
            exit 0
          fi
          awk -v tag="$tag" '
            index($0, "## " tag "（") == 1 { on = 1; next }
            on && /^## v/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          cat notes.md
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file notes.md
